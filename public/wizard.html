  if(age<18)a*=2.5;else if(age<=21)a*=2.0;else if(age<=24)a*=1.6;else if(age<=29)a*=1.2;else if(age>74)a*=1.25;else if(age>64)a*=1.1;
  if(p.marital==="married")a*=0.95;
  var yl=+p.yearsLic||5;
  if(yl<1)a*=1.5;else if(yl<3)a*=1.2;
  var val=+p.vValue||25000;
  if(val>80000)a*=1.35;else if(val>50000)a*=1.2;else if(val>35000)a*=1.1;else if(val<10000)a*=0.85;
  var vAge=new Date().getFullYear()-(+p.vYear||new Date().getFullYear());
  if(vAge<=1)a*=1.1;else if(vAge>=15)a*=0.85;
  var m=(p.vModel||"").toLowerCase();
  if(m.indexOf("civic")>-1||m.indexOf("rav4")>-1||m.indexOf("f-150")>-1||m.indexOf("tucson")>-1)a*=1.12;
  if((p.vMake||"").toLowerCase().indexOf("tesla")>-1)a*=1.25;
  if(p.vUse==="rideshare")a*=1.35;else if(p.vUse==="business")a*=1.2;else if(p.vUse==="commute_long")a*=1.1;
  var km=+p.km||15000;
  if(km<8000)a*=0.88;else if(km>25000)a*=1.1;
  if(p.parking==="garage")a*=0.93;else if(p.parking==="high_theft")a*=1.15;
  a+=(+p.atFault||0)*a*0.28;
  a+=(+p.tickets||0)*a*0.12;
  if(p.dui)a*=1.8;
  var lapse=+p.lapse||0;
  if(lapse>12)a*=1.25;else if(lapse>6)a*=1.15;
  var ded=+p.ded||1000;
  if(ded>=2000)a*=0.75;else if(ded>=1000)a*=0.87;else if(ded<=250)a*=1.1;
  var disc=0;
  if(p.winterTires&&p.country==="CA")disc+=0.08;
  if(p.bundle)disc+=0.15;
  if(p.telematics)disc+=0.12;
  if(p.multi)disc+=0.1;
  a*=(1-Math.min(disc,0.45));
  return{annual:Math.round(a),monthly:Math.round(a/12),disc:Math.round(disc*100)};
}

async function checkRecall(){
  var vin=document.getElementById("vin-input")&&document.getElementById("vin-input").value.trim();
  if(!vin||vin.length!==17){
    document.getElementById("recall-result").innerHTML='<div class="recall-info">Please enter a valid 17-character VIN number.</div>';
    return;
  }
  document.getElementById("recall-result").innerHTML='<div class="recall-info">Checking NHTSA database for your vehicle...</div>';
  try{
    var res=await fetch("https://api.nhtsa.gov/recalls/recallsByVehicle?vin="+vin);
    var data=await res.json();
    if(data.results&&data.results.length>0){
      var html='<div class="recall-warn"><strong>'+data.results.length+' open recall'+(data.results.length>1?'s':'')+'</strong> found for this vehicle. These are FREE to fix at any authorized dealer.<br><br>';
      data.results.slice(0,3).forEach(function(r){
        html+='<div style="margin-bottom:10px;padding:10px;background:rgba(255,255,255,0.5);border-radius:8px"><strong>'+r.Component+'</strong><br><span style="font-size:12px">'+r.Summary.substring(0,150)+'...</span></div>';
      });
      html+='</div>';
      document.getElementById("recall-result").innerHTML=html;
    }else{
      document.getElementById("recall-result").innerHTML='<div class="recall-safe">No open recalls found for this VIN. Your vehicle is up to date. We recommend checking again in 3-6 months as new recalls are issued regularly.</div>';
    }
  }catch(e){
    document.getElementById("recall-result").innerHTML='<div class="recall-info">Unable to connect to NHTSA database. You can check directly at nhtsa.gov/recalls.</div>';
  }
}
